name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Require an immutable SDK revision
        shell: bash
        env:
          PLUGIN_SDK_REF: ${{ vars.PLUGIN_SDK_REF }}
        run: |
          if [[ ! "$PLUGIN_SDK_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Set PLUGIN_SDK_REF to the full commit SHA of the reviewed SDK release."
            exit 1
          fi
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          repository: codexu/note-gen-plugin-sdk
          ref: ${{ vars.PLUGIN_SDK_REF }}
          path: .sdk
          persist-credentials: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.20.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @notegen/plugin-api build
      - run: pnpm --filter @notegen/plugin-cli build
      - run: pnpm --filter @notegen/plugin-test build
      - run: pnpm build
      - run: pnpm validate
      - run: pnpm test
