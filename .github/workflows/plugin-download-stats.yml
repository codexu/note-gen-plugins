name: Collect plugin download statistics

on:
  schedule:
    - cron: '37 4 * * *' # 12:37 Asia/Shanghai; Actions scheduling is best effort.
  workflow_dispatch:
    inputs:
      lookback_days:
        description: Days to recheck (1-29); use 29 for the first historical backfill
        required: true
        default: '7'
        type: string
      dry_run:
        description: Read logs and state without writing OSS
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: plugin-download-statistics
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: plugin-market-statistics
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Install statistics dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/plugin-stats"
          "$RUNNER_TEMP/plugin-stats/bin/pip" install -r tools/plugin-download-stats-requirements.txt
      - name: Collect CDN logs and publish statistics
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_ENDPOINT: ${{ vars.OSS_ENDPOINT }}
          OSS_REGION: ${{ vars.OSS_REGION }}
          OSS_BUCKET: ${{ vars.OSS_BUCKET }}
          OSS_PUBLIC_BASE_URL: ${{ vars.OSS_PUBLIC_BASE_URL }}
          CDN_DOMAIN: ${{ vars.CDN_DOMAIN }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '7' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          for name in OSS_ACCESS_KEY_ID OSS_ACCESS_KEY_SECRET OSS_ENDPOINT OSS_REGION OSS_BUCKET OSS_PUBLIC_BASE_URL CDN_DOMAIN; do
            if [ -z "${!name}" ]; then
              echo "::error::Configure $name in the plugin-market-statistics environment."
              exit 1
            fi
          done
          args=(--lookback-days "$LOOKBACK_DAYS")
          if [ "$DRY_RUN" = true ]; then
            args+=(--dry-run)
          fi
          "$RUNNER_TEMP/plugin-stats/bin/python" tools/collect-plugin-downloads.py "${args[@]}"
